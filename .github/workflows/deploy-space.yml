name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_profile:
        description: "Hugging Face image profile"
        type: choice
        options:
          - timesfm25
          - timesfm3
          - moirai
        default: timesfm25
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Select model profile
        env:
          MODEL_PROFILE: ${{ inputs.model_profile || 'timesfm25' }}
        run: |
          case "$MODEL_PROFILE" in
            timesfm25) ;;
            timesfm3) cp Dockerfile.timesfm3 Dockerfile ;;
            moirai) cp Dockerfile.moirai Dockerfile ;;
            *) echo "Unsupported model profile: $MODEL_PROFILE" >&2; exit 1 ;;
          esac

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          hf upload hrczggyorgy/TSFMs_forecasting . .
          --repo-type space
          --exclude ".git/*"
          --exclude ".github/*"
          --exclude "tests/*"
          --exclude "venv/*"
          --exclude "__pycache__/*"
          --exclude "*.pyc"
          --exclude ".pytest_cache/*"
          --exclude ".mypy_cache/*"
          --exclude "*.csv"
          --exclude "docs/*"
          --exclude "ui/*"
          --exclude ".streamlit/*"
          --exclude ".HF_TOKEN"
          --exclude ".env*"
          --exclude "*.pem"
          --exclude "*.key"
          --exclude "*.p12"
          --exclude "*.pfx"
          --exclude "*.token"
          --exclude ".git-credentials"
          --commit-message "Deploy ${GITHUB_SHA::7}"